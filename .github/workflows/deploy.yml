name: Deploy to Website

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Download missing images
      run: |
        echo "Downloading missing Pop Art images..."
        cd images/popart
        
        # Warhol Soup Cans
        wget -q --user-agent="Mozilla/5.0" --timeout=30 -O 07_warhol_soup.jpg \
          "https://upload.wikimedia.org/wikipedia/en/6/68/Campbell_Soup_Cans_by_Andy_Warhol.jpg" || echo "Soup cans failed"
        
        # Lichtenstein Drowning Girl  
        wget -q --user-agent="Mozilla/5.0" --timeout=30 -O 08_lichtenstein_drowning.jpg \
          "https://upload.wikimedia.org/wikipedia/en/a/aa/Drowning_Girl.jpg" || echo "Drowning girl failed"
        
        # Johns Three Flags
        wget -q --user-agent="Mozilla/5.0" --timeout=30 -O 09_johns_flag.jpg \
          "https://upload.wikimedia.org/wikipedia/en/0/0e/Three_Flags_by_Jasper_Johns.jpg" || echo "Three flags failed"
        
        # Wesselmann Still Life
        wget -q --user-agent="Mozilla/5.0" --timeout=30 -O 04_wesselmann_still.jpg \
          "https://upload.wikimedia.org/wikipedia/en/c/c5/Still_Life_30.jpg" || echo "Wesselmann failed"
        
        # Oldenburg Floor Burger
        wget -q --user-agent="Mozilla/5.0" --timeout=30 -O 03_oldenburg_floor.jpg \
          "https://upload.wikimedia.org/wikipedia/en/f/f0/Floor_Burger.jpg" || echo "Floor burger failed"
        
        # Hamilton Just What Is It
        wget -q --user-agent="Mozilla/5.0" --timeout=30 -O 06_hamilton_just.jpg \
          "https://upload.wikimedia.org/wikipedia/en/6/6c/Just_what_is_it_that_makes_today%27s_homes_so_different%2C_so_appealing.jpg" || echo "Hamilton failed"
        
        # Dine Car Crash
        wget -q --user-agent="Mozilla/5.0" --timeout=30 -O 10_dine_car.jpg \
          "https://upload.wikimedia.org/wikipedia/en/8/8f/Jim_Dine_The_Car_Crash.jpg" || echo "Dine failed"
        
        echo ""
        echo "Download results:"
        ls -la *.jpg
        cd ../..
    
    - name: Deploy via SFTP
      run: |
        sudo apt-get install -y sshpass
        sshpass -p "y41*^&XJlS!BaM" sftp -o StrictHostKeyChecking=no -P 22 matthiasr.com@ssh.matthiasr.com << 'SFTP_EOF'
        lcd .
        cd /public_html/art
        put -r .
        bye
        SFTP_EOF
      continue-on-error: true
    
    - name: Alternative Deploy - Lftp
      if: failure()
      run: |
        sudo apt-get install -y lftp
        lftp -u matthiasr.com,"y41*^&XJlS!BaM" sftp://ssh.matthiasr.com << 'LFTP_EOF'
        set ssl:verify-certificate no
        mirror -R . /public_html/art
        bye
        LFTP_EOF
