name: Deploy to Website

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Download missing images
      run: |
        echo "Downloading Pop Art images..."
        cd images/popart
        
        # Download missing images using wget with different user agents
        wget -q --user-agent="Mozilla/5.0" -O 07_warhol_soup.jpg \
          "https://upload.wikimedia.org/wikipedia/en/6/68/Campbell_Soup_Cans_by_Andy_Warhol.jpg" || true
        
        wget -q --user-agent="Mozilla/5.0" -O 08_lichtenstein_drowning.jpg \
          "https://upload.wikimedia.org/wikipedia/en/a/aa/Drowning_Girl.jpg" || true
        
        wget -q --user-agent="Mozilla/5.0" -O 09_johns_flag.jpg \
          "https://upload.wikimedia.org/wikipedia/en/0/0e/Three_Flags_by_Jasper_Johns.jpg" || true
        
        wget -q --user-agent="Mozilla/5.0" -O 04_wesselmann_still.jpg \
          "https://upload.wikimedia.org/wikipedia/en/c/c5/Still_Life_30.jpg" || true
        
        wget -q --user-agent="Mozilla/5.0" -O 03_oldenburg_floor.jpg \
          "https://upload.wikimedia.org/wikipedia/en/f/f0/Floor_Burger.jpg" || true
        
        wget -q --user-agent="Mozilla/5.0" -O 06_hamilton_just.jpg \
          "https://upload.wikimedia.org/wikipedia/en/6/6c/Just_what_is_it_that_makes_today%27s_homes_so_different%2C_so_appealing.jpg" || true
        
        wget -q --user-agent="Mozilla/5.0" -O 10_dine_car.jpg \
          "https://upload.wikimedia.org/wikipedia/en/8/8f/Jim_Dine_The_Car_Crash.jpg" || true
        
        cd ../..
        
        echo "Image download complete"
    
    - name: Deploy via FTP
      uses: SamKirkland/FTP-Deploy-Action@4.3.0
      with:
        server: ssh.matthiasr.com
        username: matthiasr.com
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: /public_html/art/
        local-dir: ./
