name: Download Rococo from Alternative Sources
on:
  workflow_dispatch:
  
jobs:
  download-images:
    runs-on: ubuntu-latest
    steps:
      - name: Download from alternative sources
        run: |
          mkdir -p images/rococo
          cd images/rococo
          
          echo "=== Downloading Rococo artworks from ALTERNATIVE sources ==="
          
          # 1. Fragonard - The Swing (Wallace Collection) - Use full res
          echo "1. Fragonard - The Swing..."
          curl -A "Mozilla/5.0" -L -o fragonard_swing.jpg \
            "https://commons.wikimedia.org/wiki/Special:FilePath/Jean-Honor%C3%A9%20Fragonard%20-%20The%20Swing%20-%20Google%20Art%20Project.jpg?width=1200"
          sleep 3
          
          # 2. Boucher - Venus Toilet (Met Museum direct)
          echo "2. Boucher - Venus Toilet (Met)..."
          curl -A "Mozilla/5.0" -L -o boucher_venus_toilet.jpg \
            "https://images.metmuseum.org/CRDImages/ep/original/DT1566.jpg"
          sleep 3
          
          # 3. Watteau - Gilles (Wiki via Special:FilePath)
          echo "3. Watteau - Gilles..."
          curl -A "Mozilla/5.0" -L -o watteau_gilles.jpg \
            "https://commons.wikimedia.org/wiki/Special:FilePath/Antoine%20Watteau%20-%20Gilles%20-%20Google%20Art%20Project.jpg?width=1200"
          sleep 3
          
          # 4. Watteau - Embarkation (different file)
          echo "4. Watteau - Embarkation..."
          curl -A "Mozilla/5.0" -L -o watteau_embarkation.jpg \
            "https://commons.wikimedia.org/wiki/Special:FilePath/Watteau%20-%20Pilgrimage%20to%20Cythera.jpg?width=1200"
          sleep 3
          
          # 5. Boucher - Pompadour (Alte Pinakothek via Wiki)
          echo "5. Boucher - Pompadour..."
          curl -A "Mozilla/5.0" -L -o boucher_pompadour.jpg \
            "https://commons.wikimedia.org/wiki/Special:FilePath/Fran%C3%A7ois%20Boucher%20-%20Portrait%20of%20Madame%20de%20Pompadour.jpg?width=1200"
          sleep 3
          
          # 6. Chardin - The Ray
          echo "6. Chardin - The Ray..."
          curl -A "Mozilla/5.0" -L -o chardin_ray.jpg \
            "https://commons.wikimedia.org/wiki/Special:FilePath/Jean-Baptiste%20Sim%C3%A9on%20Chardin%20-%20The%20Ray.jpg?width=1200"
          sleep 3
          
          # 7. Tiepolo - Apollo (use different approach)
          echo "7. Tiepolo - Apollo..."
          curl -A "Mozilla/5.0" -L -o tiepolo_apollo.jpg \
            "https://commons.wikimedia.org/wiki/Special:FilePath/W%C3%BCrzburger%20Residenz%2C%20Treppenhaus%20Fresko.jpg?width=1200"
          sleep 3
          
          # 8. Lancret - Picnic
          echo "8. Lancret - Picnic..."
          curl -A "Mozilla/5.0" -L -o lancret_picnic.jpg \
            "https://commons.wikimedia.org/wiki/Special:FilePath/Nicolas%20Lancret%20-%20The%20Picnic.jpg?width=1200"
          sleep 3
          
          # 9. Watteau - Mezzetin
          echo "9. Watteau - Mezzetin..."
          curl -A "Mozilla/5.0" -L -o watteau_mezzetin.jpg \
            "https://commons.wikimedia.org/wiki/Special:FilePath/Antoine%20Watteau%20-%20Mezzetin.jpg?width=1200"
          sleep 3
          
          # 10. Fragonard - The Meeting (Progress of Love)
          echo "10. Fragonard - The Meeting..."
          curl -A "Mozilla/5.0" -L -o fragonard_meeting.jpg \
            "https://commons.wikimedia.org/wiki/Special:FilePath/Fragonard%20-%20The%20Meeting.jpg?width=1200"
          
          # Verify
          echo ""
          echo "=== VERIFICATION ==="
          for f in *.jpg; do
            size=$(stat -c%s "$f" 2>/dev/null || echo 0)
            if [ "$size" -gt 50000 ]; then
              echo "✅ $f: $size bytes"
            else
              echo "❌ $f: $size bytes"
              # Show first line if it's HTML
              head -c 100 "$f"
              echo ""
            fi
          done
          
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rococo-images-v3
          path: images/rococo/
